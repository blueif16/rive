<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import RiveCanvas from "./canvas_advanced.mjs";

// The Canvas2D renderer in @rive-app/canvas-advanced is DEFERRED: draw calls push
// closures onto an internal queue, `flush()` is a no-op, and the queue is replayed
// by Rive's OWN requestAnimationFrame driver after every scheduled callback has run.
// A frame is therefore only on the canvas at the START of the following tick —
// which is why each capture below is taken one tick late, not straight after draw.
// Animation time is still advanced by a fixed dt, so what renders is deterministic;
// only the wall-clock pacing is left to the browser.

const canvas = document.getElementById("c");
let rive, renderer, file, artboard, machine, animation, bg = null;

window.boot = async ({ width, height, artboard: abName, stateMachine: smName, background }) => {
  bg = background || null;
  rive = await RiveCanvas({ locateFile: () => "/rive.wasm" });
  const bytes = new Uint8Array(await (await fetch("/scene.riv")).arrayBuffer());
  file = await rive.load(bytes);

  artboard = abName ? file.artboardByName(abName) : file.defaultArtboard();
  if (!artboard) throw new Error(`artboard ${abName ?? "(default)"} not found`);

  // Draw at the artboard's own size unless told otherwise, so one rendered pixel
  // is one artboard pixel.
  canvas.width = width || artboard.bounds.maxX - artboard.bounds.minX;
  canvas.height = height || artboard.bounds.maxY - artboard.bounds.minY;
  renderer = rive.makeRenderer(canvas);

  if (artboard.stateMachineCount() > 0) {
    const sm = smName ? artboard.stateMachineByName(smName)
                      : artboard.stateMachineByIndex(0);
    machine = new rive.StateMachineInstance(sm, artboard);
  } else if (artboard.animationCount() > 0) {
    animation = new rive.LinearAnimationInstance(artboard.animationByIndex(0), artboard);
  }
  return { width: canvas.width, height: canvas.height,
           driver: machine ? "state machine" : animation ? "animation" : "static" };
};

/** Pick a named animation instead of the state machine (files with neither wired up). */
window.useAnimation = (name) => {
  if (machine) { machine.delete(); machine = null; }
  if (animation) { animation.delete(); animation = null; }
  const la = name ? artboard.animationByName(name) : artboard.animationByIndex(0);
  if (!la) return false;
  animation = new rive.LinearAnimationInstance(la, artboard);
  return true;
};

/** Everything the file declares, so a .riv can be read without the editor. */
window.describe = async () => {
  rive = rive || await RiveCanvas({ locateFile: () => "/rive.wasm" });
  if (!file) {
    const bytes = new Uint8Array(await (await fetch("/scene.riv")).arrayBuffer());
    file = await rive.load(bytes);
  }
  const out = { artboardCount: file.artboardCount(), artboards: [] };
  for (let i = 0; i < file.artboardCount(); i++) {
    const ab = file.artboardByIndex(i);
    const entry = {
      index: i, name: ab.name,
      width: ab.bounds.maxX - ab.bounds.minX,
      height: ab.bounds.maxY - ab.bounds.minY,
      animations: [], stateMachines: [],
    };
    for (let a = 0; a < ab.animationCount(); a++) entry.animations.push(ab.animationByIndex(a).name);
    for (let s = 0; s < ab.stateMachineCount(); s++) {
      const sm = ab.stateMachineByIndex(s);
      const smi = new rive.StateMachineInstance(sm, ab);
      const inputs = [];
      for (let n = 0; n < smi.inputCount(); n++) {
        const inp = smi.input(n);
        const kind = inp.type === rive.SMIInput.bool ? "bool"
                   : inp.type === rive.SMIInput.number ? "number"
                   : inp.type === rive.SMIInput.trigger ? "trigger" : `type${inp.type}`;
        inputs.push({ name: inp.name, kind, value: kind === "trigger" ? null : inp.value });
      }
      entry.stateMachines.push({ name: sm.name, inputs });
      smi.delete();
    }
    out.artboards.push(entry);
    ab.delete();
  }
  return out;
};

window.setInput = (name, value) => {
  if (!machine) return false;
  for (let n = 0; n < machine.inputCount(); n++) {
    const inp = machine.input(n);
    if (inp.name !== name) continue;
    if (inp.type === rive.SMIInput.trigger) inp.fire(); else inp.value = value;
    return true;
  }
  return false;
};

/** Advance animation time by exactly dt, then queue this tick's draw. */
function step(dt) {
  if (machine) {
    if (typeof machine.advanceAndApply === "function") machine.advanceAndApply(dt);
    else { machine.advance(dt); artboard.advance(dt); }
  } else {
    if (animation) { animation.advance(dt); animation.apply(1); }
    artboard.advance(dt);
  }
  renderer.clear();
  renderer.save();
  renderer.align(rive.Fit.contain, rive.Alignment.center,
    { minX: 0, minY: 0, maxX: canvas.width, maxY: canvas.height }, artboard.bounds);
  artboard.draw(renderer);
  renderer.restore();
}

/** Composite the frame onto an opaque backdrop, for artboards with no Fill. */
function backdrop() {
  if (!bg) return;
  const ctx = canvas.getContext("2d");
  ctx.save();
  ctx.globalCompositeOperation = "destination-over";
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

const raf = (fn) => rive.requestAnimationFrame(fn);

/**
 * Advance `count` frames of `dt` and return each as a PNG data URL.
 * The caller batches so the page never holds a whole video in memory.
 */
window.renderBatch = (count, dt) => new Promise((resolve, reject) => {
  const frames = [];
  let armed = false;   // is a painted frame waiting to be read?
  const tick = () => {
    try {
      if (armed) { backdrop(); frames.push(canvas.toDataURL("image/png")); armed = false; }
      if (frames.length >= count) return resolve(frames);
      step(dt);
      armed = true;
      raf(tick);
    } catch (e) { reject(e); }
  };
  raf(tick);
});

// ------------------------------------------------------------------ probe ---
// Placement measurement. The runtime exposes worldTransform() on a named
// TransformComponent but NO width/height, so a node's on-screen EXTENT is not
// derivable from the API — the painted pixels are the only ground truth. Every
// measurement below is therefore taken from the frame buffer, and the analysis
// runs in-page so a probe returns a few hundred bytes instead of a 3 MB bitmap.

/** Step exactly `n` frames and resolve once frame `n` is actually PAINTED. */
window.advanceFrames = (n, dt) => new Promise((resolve, reject) => {
  let i = 0;
  const tick = () => {
    try {
      if (i >= n) return resolve(true);   // last step's paint landed this tick
      step(dt); i++;
      raf(tick);
    } catch (e) { reject(e); }
  };
  raf(tick);
});

/** World-space origin of a named node, or null. Origin only — never extent. */
window.probeNode = (name) => {
  try {
    const tc = artboard.transformComponent(name);
    if (!tc) return null;
    const m = tc.worldTransform();
    return { name, tx: m.tx, ty: m.ty, xx: m.xx, xy: m.xy, yx: m.yx, yy: m.yy };
  } catch (e) { return null; }
};

/**
 * Measure the painted frame.
 *  - background = modal colour, so this works on any palette without config
 *  - ink        = pixels far enough from that background
 *  - grid       = per-cell ink fraction (the "bitmask" an agent reads)
 *  - components = 8-connected ink blobs with pixel-exact bounding boxes
 *  - regions    = caller-named rects, with coverage and the ink bbox inside
 */
window.analyze = ({ cols = 60, rows = 0, threshold = 24, minPx = 120,
                    regions = null, maxComponents = 40 } = {}) => {
  const W = canvas.width, H = canvas.height;
  const px = canvas.getContext("2d").getImageData(0, 0, W, H).data;

  // Modal colour at 5-bit precision = the background, whatever the palette is.
  const hist = new Map();
  for (let i = 0; i < px.length; i += 4) {
    const k = ((px[i] >> 3) << 10) | ((px[i + 1] >> 3) << 5) | (px[i + 2] >> 3);
    hist.set(k, (hist.get(k) || 0) + 1);
  }
  let bgKey = 0, bgCount = -1;
  for (const [k, c] of hist) if (c > bgCount) { bgCount = c; bgKey = k; }
  const bg = [((bgKey >> 10) & 31) << 3, ((bgKey >> 5) & 31) << 3, (bgKey & 31) << 3];

  const ink = new Uint8Array(W * H);
  let inkTotal = 0;
  for (let p = 0, i = 0; p < W * H; p++, i += 4) {
    const dr = px[i] - bg[0], dg = px[i + 1] - bg[1], db = px[i + 2] - bg[2];
    if (dr * dr + dg * dg + db * db > threshold * threshold && px[i + 3] > 8) {
      ink[p] = 1; inkTotal++;
    }
  }

  // Square-ish cells: derive rows from the aspect ratio unless pinned.
  const cw = W / cols;
  const r = rows || Math.max(1, Math.round(H / cw / 2));   // /2 = terminal char aspect
  const ch = H / r;
  const grid = [];
  for (let gy = 0; gy < r; gy++) {
    const row = [];
    for (let gx = 0; gx < cols; gx++) {
      const x0 = Math.floor(gx * cw), x1 = Math.min(W, Math.ceil((gx + 1) * cw));
      const y0 = Math.floor(gy * ch), y1 = Math.min(H, Math.ceil((gy + 1) * ch));
      let n = 0;
      for (let y = y0; y < y1; y++) { const o = y * W; for (let x = x0; x < x1; x++) n += ink[o + x]; }
      row.push((x1 - x0) * (y1 - y0) ? n / ((x1 - x0) * (y1 - y0)) : 0);
    }
    grid.push(row);
  }

  // 8-connected components, iterative so a full-width blob cannot blow the stack.
  const lbl = new Int32Array(W * H).fill(-1);
  const comps = [];
  const stack = new Int32Array(W * H);
  for (let s = 0; s < W * H; s++) {
    if (!ink[s] || lbl[s] !== -1) continue;
    const id = comps.length;
    let sp = 0; stack[sp++] = s; lbl[s] = id;
    let x0 = W, y0 = H, x1 = -1, y1 = -1, count = 0;
    while (sp > 0) {
      const p = stack[--sp], y = (p / W) | 0, x = p - y * W;
      count++;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) {
        const ny = y + dy; if (ny < 0 || ny >= H) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx; if (nx < 0 || nx >= W) continue;
          const q = ny * W + nx;
          if (ink[q] && lbl[q] === -1) { lbl[q] = id; stack[sp++] = q; }
        }
      }
    }
    comps.push({ x0, y0, x1, y1, w: x1 - x0 + 1, h: y1 - y0 + 1, px: count });
  }
  comps.sort((a, b) => b.px - a.px);
  const kept = comps.filter((c) => c.px >= minPx).slice(0, maxComponents)
                    .map((c, i) => ({ id: i, ...c }));

  // Named rects: how much ink is inside, and where inside it actually sits.
  let regionOut = null;
  if (regions) {
    regionOut = {};
    for (const [name, [rx0, ry0, rx1, ry1]] of Object.entries(regions)) {
      const ax0 = Math.max(0, Math.floor(rx0)), ax1 = Math.min(W, Math.ceil(rx1));
      const ay0 = Math.max(0, Math.floor(ry0)), ay1 = Math.min(H, Math.ceil(ry1));
      let n = 0, bx0 = W, by0 = H, bx1 = -1, by1 = -1;
      for (let y = ay0; y < ay1; y++) {
        const o = y * W;
        for (let x = ax0; x < ax1; x++) if (ink[o + x]) {
          n++;
          if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
          if (y < by0) by0 = y; if (y > by1) by1 = y;
        }
      }
      const area = Math.max(0, (ax1 - ax0)) * Math.max(0, (ay1 - ay0));
      regionOut[name] = {
        rect: [rx0, ry0, rx1, ry1], area, inkPx: n,
        coverage: area ? n / area : 0,
        inkBox: bx1 < 0 ? null : [bx0, by0, bx1, by1],
      };
    }
  }

  return { w: W, h: H, bg, inkTotal, inkFraction: inkTotal / (W * H),
           cols, rows: r, cellW: cw, cellH: ch, grid,
           components: kept, componentsTotal: comps.length, regions: regionOut };
};

window.__ready = true;
</script>
</body>
</html>
