<html lang="en">

<style>

<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="controls">

  if (alpha <= 0 || reveal <= 0) return;

card({ id: 'C8', start: 16.0, end: 18.0, stage: C.ink, line: null, holdStart: 1.34,

    const pos = NODES.map((n, i) => [n[1] + DRIFT[i][0] * drift, n[2] + DRIFT[i][1] * drift]);

    const la = mv(l, 0.90, 'fastEffects'), lr = lin(l, 0.90, 0.40);
    for (const [a, b, side] of SEGS) {
      const A = pos[a], B = pos[b];
      const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
      let px_ = -(B[1] - A[1]), py_ = B[0] - A[0]; const pl = Math.hypot(px_, py_); px_ /= pl; py_ /= pl;
      const ctrl = [mx + 30 * side * px_, my + 30 * side * py_];

      let i1 = full.length - 1; while (i1 > 0 && Math.hypot(full[i1][0] - B[0], full[i1][1] - B[1]) < Rb) i1--;

function cardAt(t) {
  if (t >= DUR) return CARDS[CARDS.length - 1];
  for (const c of CARDS) if (t >= c.start && t < c.end) return c;
  return CARDS[0];
}
function render(t) {
  t = Math.max(0, Math.min(DUR, t));
  const c = cardAt(t);
  const local = Math.min(t, DUR) - c.start;
  DBG.t = t; DBG.card = c.id; DBG.lines = []; DBG.shapes = []; DBG.accents = []; DBG.swaps = []; DBG.ground = null;
  ctx.setTransform(BASE, 0, 0, BASE, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = c.stage; ctx.fillRect(0, 0, W, H);

}

// ---------------------------------------------------------------- census -----
const PAL = Object.entries(C).map(([k, v]) => [k, parseInt(v.slice(1, 3), 16), parseInt(v.slice(3, 5), 16), parseInt(v.slice(5, 7), 16)]);
function census() {
  const src = THUMB ? offc : canvas;
  const g = src.getContext('2d');
  const d = g.getImageData(0, 0, src.width, src.height).data;
  const counts = new Map(); let other = 0;
  const key = PAL.map(p => (p[1] << 16) | (p[2] << 8) | p[3]); const names = PAL.map(p => p[0]);
  for (let i = 0; i < d.length; i += 4) {
    const k = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
    const j = key.indexOf(k);
    if (j < 0) other++; else counts.set(names[j], (counts.get(names[j]) || 0) + 1);
  }
  const res = { t: DBG.t, card: DBG.card, palette: [...counts.entries()].sort((a, b) => b[1] - a[1]), paletteCount: counts.size, other, total: d.length / 4 };
  if (CENSUS) console.log('census', JSON.stringify(res));
  return res;
}
function pixelAt(x, y) { const g = canvas.getContext('2d'); const d = g.getImageData(Math.round(x * BASE), Math.round(y * BASE), 1, 1).data; return '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase(); }

// -------------------------------------------------------------- controls -----
let playing = false, tCur = 0, lastTs = null, perfEma = null, playHandle = null;
const $ = id => document.getElementById(id);
function sizeCanvas() {
  if (THUMB) { canvas.width = 160 * dpr; canvas.height = 90 * dpr; canvas.style.width = '160px'; canvas.style.height = '90px'; ctx = offctx; BASE = 1; return; }
  canvas.width = W * dpr; canvas.height = H * dpr; BASE = dpr;
  if (STILL_T !== null) { canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; return; }
  const cw = Math.max(320, Math.min(W, window.innerWidth - 24, (window.innerHeight - 70) * W / H));
  canvas.style.width = cw + 'px'; canvas.style.height = (cw * H / W) + 'px';
}
function updateUI() {
  $('time').textContent = tCur.toFixed(3) + ' s';
  $('scrub').querySelector('.head').style.left = (tCur / DUR * 100) + '%';
  $('play').textContent = playing ? 'Pause' : 'Play';
  if (perfEma !== null) $('perf').textContent = perfEma.toFixed(2) + ' ms/frame';
}
function seek(t) { tCur = Math.max(0, Math.min(DUR, t)); render(tCur); updateUI(); }
function frame(ts) {

    lastTs = ts;
    const p0 = performance.now(); render(tCur); const dt = performance.now() - p0;
    perfEma = perfEma === null ? dt : perfEma * 0.9 + dt * 0.1;

  }

}
function togglePlay() { playing = !playing; lastTs = null; if (playing && tCur >= DUR) tCur = 0; updateUI(); }
function record() {
  if (!('MediaRecorder' in window)) return;
  const stream = canvas.captureStream(60); const chunks = [];
  const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'buildnight.webm'; a.click(); };
  tCur = 0; playing = true; lastTs = null; rec.start();
  const poll = () => { if (!playing) { rec.stop(); return; } setTimeout(poll, 100); }; setTimeout(poll, 100);
}
function setupControls() {
  const sc = $('scrub');
  for (const c of CARDS) { const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (c.start / DUR * 100) + '%'; tk.title = c.id + ' ' + c.start + ' s'; sc.appendChild(tk); }
  let dragging = false;
  const at = e => { const r = sc.getBoundingClientRect(); return (e.clientX - r.left) / r.width * DUR; };
  sc.addEventListener('mousedown', e => { dragging = true; playing = false; seek(at(e)); });
  window.addEventListener('mousemove', e => { if (dragging) seek(at(e)); });
  window.addEventListener('mouseup', () => { dragging = false; });
  $('play').addEventListener('click', togglePlay);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); playing = false; seek(tCur + (e.shiftKey ? 0.25 : 1 / 24)); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); playing = false; seek(tCur - (e.shiftKey ? 0.25 : 1 / 24)); }
    else if (e.key === 'r' || e.key === 'R') record();
  });
  window.addEventListener('resize', () => { sizeCanvas(); render(tCur); });
}

// --------------------------------------------------------------- exports -----
window.renderAt = function (t) { tCur = Math.max(0, Math.min(DUR, t)); render(tCur); if (!THUMB && STILL_T === null) updateUI(); return JSON.parse(JSON.stringify(DBG)); };
window.census = census;
window.pixelAt = pixelAt;
window.curvePeaks = () => Object.fromEntries(Object.keys(TOK).map(k => [k, curvePeak(k)]));
window.moveTable = () => CARDS.map(c => ({ id: c.id, start: c.start, end: c.end, stage: c.stage, line: c.line, holdStart: c.holdStart, moves: c.moves }));
window.fontInfo = () => {
  const faces = ['Google Sans', 'Product Sans', 'Avenir Next', 'Helvetica Neue', 'Arial'];
  const resolved = faces.find(f => document.fonts.check(`600 86px '${f}'`)) || 'sans-serif';
  const m86 = met(86, 'H'), m158 = met(158, 'H');
  return { resolved, capH86: m86.a, capH158: m158.a, idot: IDOT, rm: RM };
};
window.frameHash = function () {
  const src = THUMB ? offc : canvas; const d = src.getContext('2d').getImageData(0, 0, src.width, src.height).data;
  let h = 2166136261 >>> 0; for (let i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 16777619) >>> 0; } return h.toString(16);
};
window.timeRender = function (n) { const p0 = performance.now(); for (let i = 0; i < n; i++) render((i / n) * DUR); return (performance.now() - p0) / n; };
// Pixel probes for the verification script (frame px, exact colour matches).
function hexToKey(hex) { return parseInt(hex.slice(1), 16); }
function frameData() { const src = THUMB ? offc : canvas; return { d: src.getContext('2d').getImageData(0, 0, src.width, src.height).data, w: src.width, h: src.height }; }
window.scanRows = function (x0, x1, y0, y1, hex) {   // first/last row in [y0,y1] holding an exact-colour pixel within columns [x0,x1]
  const { d, w } = frameData(); const k = hexToKey(hex); let minR = -1, maxR = -1;
  for (let y = Math.max(0, Math.floor(y0 * BASE)); y <= Math.min(H * BASE - 1, Math.ceil(y1 * BASE)); y++) {
    let hit = false;
    for (let x = Math.max(0, Math.floor(x0 * BASE)); x <= Math.min(W * BASE - 1, Math.ceil(x1 * BASE)); x++) { const i = (y * w + x) * 4; if (((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]) === k) { hit = true; break; } }
    if (hit) { if (minR < 0) minR = y; maxR = y; }
  }
  return minR < 0 ? null : [minR / BASE, maxR / BASE, (maxR - minR + 1) / BASE];
};
window.countOutside = function (poly, hex) {         // pixels of colour hex whose centre lies outside polygon (frame px)
  const { d, w, h } = frameData(); const k = hexToKey(hex); let out = 0, total = 0;
  const inside = (x, y) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]) !== k) continue; total++; if (!inside((x + 0.5) / BASE, (y + 0.5) / BASE)) out++; }
  return { total, outside: out };
};
window.occupancy = function (stageHex) {             // share of pixels that are not the stage colour
  const { d } = frameData(); const k = hexToKey(stageHex); let n = 0; const tot = d.length / 4;
  for (let i = 0; i < d.length; i += 4) if (((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]) !== k) n++;
  return n / tot;
};
window.dataURL = () => (THUMB ? offc : canvas).toDataURL('image/png');
window.diffAgainst = async function (url) {          // count of pixels differing between the current frame and a PNG data URL
  const img = new Image(); await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const oc = document.createElement('canvas'); oc.width = img.width; oc.height = img.height; const g = oc.getContext('2d'); g.drawImage(img, 0, 0);
  const a = g.getImageData(0, 0, oc.width, oc.height).data; const { d: b } = frameData();
  if (a.length !== b.length) return -1;
  let n = 0, x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1; const w = oc.width;
  for (let i = 0; i < a.length; i += 4) if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2]) { n++; const p = i / 4, x = p % w, y = (p - x) / w; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  window.__lastDiffBox = n ? [x0, y0, x1, y1] : null;
  return n;
};

// ------------------------------------------------------------------ boot -----
(function boot() {
  if (THUMB) document.body.classList.add('thumb');
  else if (STILL_T !== null) document.body.classList.add('still');
  sizeCanvas();
  if (STILL_T !== null || THUMB) {
    tCur = Math.max(0, Math.min(DUR, STILL_T || 0)); render(tCur);
    if (CENSUS) census();
    window.__ready = true; return;
  }
  setupControls(); seek(0); requestAnimationFrame(frame); window.__ready = true;
})();
</script>
