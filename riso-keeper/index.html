<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>keeper</title>
<style>
  html,body{margin:0;background:#1c1b19;color:#F2EDE3;font:12px/1.4 ui-monospace,Menlo,monospace;}
  body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;}
  body.still{display:block;width:720px;height:720px;padding:0;margin:0;overflow:hidden;background:#F2EDE3;}
  #stage{width:720px;height:720px;display:block;image-rendering:pixelated;background:#F2EDE3;}
  #controls{width:720px;display:flex;gap:10px;align-items:center;}
  body.still #controls,body.still #load,body.still #verify,body.still #help{display:none;}
  #scrub{position:relative;flex:1;height:26px;}
  #scrub input{width:100%;margin:0;position:absolute;left:0;top:0;height:18px;}
  #marks{position:absolute;left:0;right:0;bottom:0;height:6px;pointer-events:none;}
  #marks i{position:absolute;top:0;width:2px;height:6px;background:#FFE800;}
  #load{width:720px;height:4px;background:#333;}
  #load b{display:block;height:100%;width:0;background:#FFE800;}
  #verify{width:720px;white-space:pre;margin:0;}
  #help{width:720px;opacity:.6;}
  button{font:inherit;background:#333;color:#F2EDE3;border:1px solid #555;padding:2px 8px;cursor:pointer;}
</style>
</head>
<body>
<canvas id="stage" width="720" height="720"></canvas>
<div id="load"><b></b></div>
<div id="controls">
  <button id="play">play</button>
  <div id="scrub"><input id="range" type="range" min="0" max="20" step="0.041666667" value="0"><div id="marks"></div></div>
  <span id="time">0.000</span>
</div>
<div id="help">space play/pause · ←/→ step 1/24 s · R record webm · M click · ?t=9.25 · ?texture=0 · ?verify=1</div>
<pre id="verify"></pre>
<script>
'use strict';
/* ====================================================================
   keeper — a risograph animation, Canvas 2D, no assets.
   Everything below is drawn by code; every random value is seeded.
   ==================================================================== */

/* ---------------------------- 0. constants ------------------------- */
const W=720,H=720,AX=360,AY=360,M=4,PW=W+2*M,PH=H+2*M,FPS=24,DUR=20;
const INKS=['yellow','pink','blue','indigo'];              // print order
const HEX={indigo:'#2E3192',blue:'#0078BF',yellow:'#FFE800',pink:'#FF48B0'};
const PAPER='#F2EDE3';
const ANGLE={indigo:45,blue:15,pink:75,yellow:0};
const PITCH=5;
const ACTS=[0,4,7,13,17,20];
const Q=new URLSearchParams(location.search);
const TEXTURE=Q.get('texture')!=='0';
const TAU=Math.PI*2,RAD=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,p)=>a+(b-a)*p;
const easeOutCubic=p=>1-Math.pow(1-clamp(p,0,1),3);
const easeInOutCubic=p=>{p=clamp(p,0,1);return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;};
const easeInQuad=p=>{p=clamp(p,0,1);return p*p;};
// two-key easeOutBack: 0 -> 1.08 (first 70 %) -> 1.0
const easeOutBack2=p=>{p=clamp(p,0,1);return p<0.7?lerp(0,1.08,easeOutCubic(p/0.7)):lerp(1.08,1.0,(p-0.7)/0.3);};
const frac=v=>v-Math.floor(v);

/* ---------------------------- 1. seeded PRNG ----------------------- */
function hash32(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);}return h>>>0;}
function rng(key){
  let a=hash32(key)||1;
  const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  f.range=(lo,hi)=>lo+(hi-lo)*f();
  f.int=(lo,hi)=>Math.floor(lo+(hi-lo+1)*f());
  f.pick=arr=>arr[Math.floor(f()*arr.length)];
  return f;
}

/* ---------------------------- 2. canvas helpers -------------------- */
function mk(w=PW,h=PH){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');return{c,x};}
function grey(v){const g=Math.round(clamp(v,0,1)*255);return`rgb(${g},${g},${g})`;}
function styleOf(c){return typeof c==='number'?grey(c):c;}
function disc(cx,cy,r){const p=new Path2D();p.arc(cx,cy,r,0,TAU);return p;}
function rect(x,y,w,h){const p=new Path2D();p.rect(x,y,w,h);return p;}
function jit(pts,r,j){return j?pts.map(p=>[p[0]+r.range(-j,j),p[1]+r.range(-j,j)]):pts.map(p=>p.slice());}
// straight polygon with seeded vertex jitter
function poly(pts,r,j=1.5,closed=true){pts=jit(pts,r,TEXTURE?j:0);const p=new Path2D();pts.forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));if(closed)p.closePath();return p;}
// smooth closed/open blob through points (Catmull-Rom), seeded jitter
function catmull(pts,closed,step=3){
  const n=pts.length,out=[];
  const P=i=>closed?pts[((i%n)+n)%n]:pts[clamp(i,0,n-1)];
  const segs=closed?n:n-1;
  for(let i=0;i<segs;i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    const L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);const k=Math.max(2,Math.ceil(L/step));
    for(let j=0;j<k;j++){const s=j/k,s2=s*s,s3=s2*s;
      out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*s+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*s2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*s3),
                0.5*((2*p1[1])+(-p0[1]+p2[1])*s+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*s2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*s3)]);}}
  if(!closed)out.push(pts[n-1].slice());
  return out;
}
function blob(pts,r,j=1.5,closed=true){pts=jit(pts,r,TEXTURE?j:0);const s=catmull(pts,closed);const p=new Path2D();s.forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));if(closed)p.closePath();return p;}
function samplePolyline(pts,step,smooth){
  if(smooth&&pts.length>2)return catmull(pts,false,step);
  const out=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const n=Math.max(1,Math.ceil(L/step));for(let k=0;k<n;k++){const s=k/n;out.push([lerp(a[0],b[0],s),lerp(a[1],b[1],s)]);}}
  out.push(pts[pts.length-1].slice());return out;
}
// A hand-drawn stroke: low-frequency wobble on position and width, tapered ends.
// Returns the Path2D; opts.prefix (0..1) draws only the first part of the arc length.
function strokePath(pts,w,r,{smooth=false,wob=1.5,wwob=1,taper=8,prefix=1}={}){
  if(!TEXTURE){wob=0;wwob=0;}
  const S=samplePolyline(pts,3,smooth);
  const L=[0];for(let i=1;i<S.length;i++)L.push(L[i-1]+Math.hypot(S[i][0]-S[i-1][0],S[i][1]-S[i-1][1]));
  const total=L[L.length-1];const p=new Path2D();if(total<0.5)return p;
  const f1=r.range(0.02,0.05),f2=r.range(0.06,0.12),ph1=r()*TAU,ph2=r()*TAU,pw=r()*TAU,fw=r.range(0.03,0.08);
  const lim=total*clamp(prefix,0,1);
  const left=[],right=[];
  for(let i=0;i<S.length;i++){
    if(L[i]>lim&&i>0){ // interpolate final point at lim
      const a=S[i-1],b=S[i];const f=(lim-L[i-1])/Math.max(1e-6,L[i]-L[i-1]);S[i]=[lerp(a[0],b[0],f),lerp(a[1],b[1],f)];L[i]=lim;}
    const q=S[i];const a=i>0?S[i-1]:S[i],b=i<S.length-1?S[i+1]:S[i];
    let tx=b[0]-a[0],ty=b[1]-a[1];const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;const nx=-ty,ny=tx;
    const s=L[i];const off=wob*(0.6*Math.sin(s*f1+ph1)+0.4*Math.sin(s*f2+ph2));
    let hw=(w+wwob*Math.sin(s*fw+pw))/2;
    const end=Math.min(s,lim-s);if(end<taper)hw*=Math.max(0.12,end/taper);
    const cx=q[0]+nx*off,cy=q[1]+ny*off;
    left.push([cx+nx*hw,cy+ny*hw]);right.push([cx-nx*hw,cy-ny*hw]);
    if(L[i]>=lim)break;
  }
  if(left.length<2)return p;
  p.moveTo(left[0][0],left[0][1]);for(let i=1;i<left.length;i++)p.lineTo(left[i][0],left[i][1]);
  for(let i=right.length-1;i>=0;i--)p.lineTo(right[i][0],right[i][1]);p.closePath();return p;
}
// A ring whose radius is modulated by three slow sine terms (wob = fraction, 0 = perfect).
function ringPath(cx,cy,r,w,rr,wob=0.03){
  if(!TEXTURE)wob=0;
  const n=Math.max(64,Math.round(r*1.5));
  const a1=rr.range(0.5,1),a2=rr.range(0.3,0.8),a3=rr.range(0.2,0.6),p1=rr()*TAU,p2=rr()*TAU,p3=rr()*TAU,pw=rr()*TAU;
  const sum=a1+a2+a3;
  const R=th=>r*(1+wob*(a1*Math.sin(2*th+p1)+a2*Math.sin(3*th+p2)+a3*Math.sin(5*th+p3))/sum);
  const Wd=th=>w+(wob>0?Math.sin(4*th+pw)*Math.min(1,w*0.25):0);
  const p=new Path2D();
  for(let i=0;i<=n;i++){const th=i/n*TAU;const ro=R(th)+Wd(th)/2;const x=cx+Math.cos(th)*ro,y=cy+Math.sin(th)*ro;i?p.lineTo(x,y):p.moveTo(x,y);}
  p.closePath();
  for(let i=n;i>=0;i--){const th=i/n*TAU;const ri=Math.max(0,R(th)-Wd(th)/2);const x=cx+Math.cos(th)*ri,y=cy+Math.sin(th)*ri;i===n?p.moveTo(x,y):p.lineTo(x,y);}
  p.closePath();return p;
}
function wdisc(cx,cy,r,key,wob=0.025){if(!TEXTURE||r<6)return disc(cx,cy,r);const rr=rng(key);const a1=rr.range(0.5,1),a2=rr.range(0.3,0.8),a3=rr.range(0.2,0.6),p1=rr()*TAU,p2=rr()*TAU,p3=rr()*TAU;const sum=a1+a2+a3;const n=Math.max(48,Math.round(r*1.5));const p=new Path2D();
  for(let i=0;i<=n;i++){const th=i/n*TAU;const R=r*(1+wob*(a1*Math.sin(2*th+p1)+a2*Math.sin(3*th+p2)+a3*Math.sin(5*th+p3))/sum);const x=cx+Math.cos(th)*R,y=cy+Math.sin(th)*R;i?p.lineTo(x,y):p.moveTo(x,y);}p.closePath();return p;}
function perfectRing(cx,cy,r,w){const p=new Path2D();p.arc(cx,cy,r+w/2,0,TAU);p.closePath();p.arc(cx,cy,r-w/2,0,TAU,true);p.closePath();return p;}
// pink crescent on the right edge of the lamp disc (its own plate is offset +2 px)
function crescentPath(cx,cy,r,s=1){const p=new Path2D();p.arc(cx,cy,r*s,0,TAU);p.closePath();p.arc(cx-3*s,cy,r*s,0,TAU,true);p.closePath();return p;}
function motifDisc(s=1){if(s>=1)return wdisc(AX,AY,18,'motif');const p=new Path2D();p.addPath(wdisc(AX,AY,18,'motif'),new DOMMatrix().translate(AX,AY).scale(s).translate(-AX,-AY));return p;}
function motifKnock(){return wdisc(AX,AY,19,'motif',0.025*18/19);}

/* ---------------------------- 3. screens --------------------------- */
const FIELDS={};        // ink -> inverted dot field (grey = 1 - threshold)
const GRAINS=[];        // three stochastic fields, picked per object
let COARSE9=null;       // yellow 0° at pitch 9 (campfire halo)
const FMAX=253;         // keeps 0-coverage pixels un-inked after 8-bit rounding
function spotEuclid(fu,fv){const ax=Math.abs(fu),ay=Math.abs(fv);return ax+ay>1?(ax-1)*(ax-1)+(ay-1)*(ay-1)-1:1-(ax*ax+ay*ay);}
function buildDotField(angleDeg,pitch){
  const {c,x}=mk();const img=x.createImageData(PW,PH);const d=img.data;
  const a=angleDeg*RAD,ca=Math.cos(a),sa=Math.sin(a);
  const cell=new Int32Array(PW*PH);
  for(let py=0;py<PH;py++)for(let px=0;px<PW;px++){
    const X=px-M+0.5,Y=py-M+0.5;
    const u=(X*ca+Y*sa)/pitch,v=(-X*sa+Y*ca)/pitch;
    const iu=Math.floor(u),iv=Math.floor(v);
    const fu=(u-iu)*2-1,fv=(v-iv)*2-1;
    const s=spotEuclid(fu,fv);
    const i=(py*PW+px)*4,g=Math.round((1+s)/2*FMAX);
    d[i]=d[i+1]=d[i+2]=g;d[i+3]=255;cell[py*PW+px]=(iu+2048)*4096+(iv+2048);
  }
  x.putImageData(img,0,0);c.cell=cell;return c;
}
function buildGrainField(key,pitch){
  const nx=Math.ceil(PW/pitch)+3,ny=Math.ceil(PH/pitch)+3;
  const r=rng(key);const cx=new Float32Array(nx*ny),cy=new Float32Array(nx*ny);
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){cx[j*nx+i]=(i-1+0.2+0.6*r())*pitch;cy[j*nx+i]=(j-1+0.2+0.6*r())*pitch;}
  const {c,x}=mk();const img=x.createImageData(PW,PH);const d=img.data;const cell=new Int32Array(PW*PH);
  const k=Math.PI/(pitch*pitch);
  for(let py=0;py<PH;py++)for(let px=0;px<PW;px++){
    const X=px+0.5,Y=py+0.5;const ci=Math.floor(X/pitch)+1,cj=Math.floor(Y/pitch)+1;
    let best=1e9,bi=0;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const n=(cj+dj)*nx+(ci+di);const dx=cx[n]-X,dy=cy[n]-Y;const dd=dx*dx+dy*dy;if(dd<best){best=dd;bi=n;}}
    const T=Math.min(1,best*k);const i=(py*PW+px)*4,g=Math.round((1-T)*FMAX);
    d[i]=d[i+1]=d[i+2]=g;d[i+3]=255;cell[py*PW+px]=bi;
  }
  x.putImageData(img,0,0);c.cell=cell;return c;
}
function buildScreens(){
  for(const ink of INKS)FIELDS[ink]=buildDotField(ANGLE[ink],PITCH);
  for(let i=0;i<3;i++)GRAINS.push(buildGrainField('grain:'+i,3));
  COARSE9=buildDotField(0,9);
}
const HALF=mk();
// Threshold the coverage plate against the field and tint: out = ink where covered, white elsewhere.
function screenTo(out,cov,field,ink){
  const h=HALF.x;
  h.setTransform(1,0,0,1,0,0);h.globalCompositeOperation='source-over';h.globalAlpha=1;h.filter='none';
  h.fillStyle='#000';h.fillRect(0,0,PW,PH);
  h.globalAlpha=0.5;h.drawImage(cov,0,0);
  h.globalCompositeOperation='lighter';h.drawImage(field,0,0);
  h.globalAlpha=1;h.globalCompositeOperation='source-over';
  const o=out.x;o.setTransform(1,0,0,1,0,0);o.globalCompositeOperation='source-over';o.filter='none';o.globalAlpha=1;
  o.fillStyle=HEX[ink];o.fillRect(0,0,PW,PH);
  o.filter='contrast(1000000%) invert(1)';o.globalCompositeOperation='screen';o.drawImage(HALF.c,0,0);
  o.filter='none';o.globalCompositeOperation='source-over';
}
// texture=0: continuous tint, no screen
function flatTo(out,cov,ink){
  const o=out.x;o.setTransform(1,0,0,1,0,0);o.filter='none';o.globalCompositeOperation='source-over';o.globalAlpha=1;
  o.fillStyle=HEX[ink];o.fillRect(0,0,PW,PH);
  o.filter='invert(1)';o.globalCompositeOperation='screen';o.drawImage(cov,0,0);
  o.filter='none';o.globalCompositeOperation='source-over';
}

/* ---------------------------- 4. plates & sheets ------------------- */
class Plate{
  constructor(ink){this.ink=ink;const p=mk();this.c=p.c;this.x=p.x;this.x.fillStyle='#000';this.x.fillRect(0,0,PW,PH);this.x.translate(M,M);this.zones=[];this.field=null;this.zoneMask=null;}
  zone(fieldC){let z=this.zones.find(z=>z.field===fieldC);if(!z){const m=mk();m.x.translate(M,M);z={field:fieldC,mask:m};this.zones.push(z);}return z.mask.x;}
  unzone(path){for(const z of this.zones){z.mask.x.globalCompositeOperation='destination-out';z.mask.x.fillStyle='#fff';z.mask.x.fill(path);z.mask.x.globalCompositeOperation='source-over';}}
  finalize(){
    const base=FIELDS[this.ink];
    if(!this.zones.length){this.field=base;this.cellOf=(px,py)=>base.cell[py*PW+px];return;}
    const f=mk();f.x.drawImage(base,0,0);const tmp=mk();
    const zm=mk();zm.x.translate(M,M);
    for(const z of this.zones){tmp.x.globalCompositeOperation='source-over';tmp.x.clearRect(0,0,PW,PH);tmp.x.drawImage(z.field,0,0);tmp.x.globalCompositeOperation='destination-in';tmp.x.drawImage(z.mask.c,0,0);f.x.drawImage(tmp.c,0,0);}
    this.field=f.c;
    // cell lookup for dissolves: which field owns each pixel
    const zones=this.zones.map(z=>({field:z.field,data:z.mask.x.getImageData(0,0,PW,PH).data}));
    this.cellOf=(px,py)=>{const i=(py*PW+px)*4+3;for(let k=zones.length-1;k>=0;k--)if(zones[k].data[i]>127)return zones[k].field.cell[py*PW+px]+1e9*(k+1);return base.cell[py*PW+px];};
    this.zones=[];
  }
}
class Sheet{
  constructor(id){this.id=id;this.plates={};const s=mk();s.x.translate(M,M);this.strokes=s;this.masks={};this.pinkBase=null;}
  pinkField(path){if(!this.pinkBase)this.pinkBase=new Path2D();this.pinkBase.addPath(path);}
  silhouette(path){(this.silh||(this.silh=[])).push(path);}
  figure(pieces,baseCov,inks=['blue']){for(const q of pieces){for(const ink of inks)if(this.plates[ink])this.knockTrap(ink,q,baseCov);this.fill('indigo',q,1);this.silhouette(q);}}
  P(ink){return this.plates[ink]||(this.plates[ink]=new Plate(ink));}
  r(name){return rng(this.id+':'+name);}
  grainField(key){return GRAINS[hash32(this.id+':'+key)%GRAINS.length];}
  fill(ink,path,c){const p=this.P(ink);p.x.fillStyle=styleOf(c);p.x.fill(path);p.unzone(path);}
  grain(ink,path,c,key){const p=this.P(ink);p.x.fillStyle=styleOf(c);p.x.fill(path);p.unzone(path);const z=p.zone(this.grainField(key));z.fillStyle='#fff';z.fill(path);}
  coarse(ink,path,c){const p=this.P(ink);p.x.fillStyle=styleOf(c);p.x.fill(path);p.unzone(path);const z=p.zone(COARSE9);z.fillStyle='#fff';z.fill(path);}
  knock(ink,path){const p=this.P(ink);p.x.fillStyle='#000';p.x.fill(path);}
  knockAll(path,inks=['blue','pink']){for(const ink of inks)if(this.plates[ink])this.knock(ink,path);}
  // knockout with a 1 px trap of the base (base coverage c) running under the darker fill's edge
  knockTrap(ink,path,c){const p=this.P(ink);p.x.fillStyle='#000';p.x.fill(path);p.x.strokeStyle=styleOf(c);p.x.lineWidth=2;p.x.stroke(path);
    const s=this.strokes.x;s.strokeStyle='#fff';s.lineWidth=2;s.stroke(path);}
  // additive ink (screen): c' = c + a - c*a
  add(ink,path,c){const p=this.P(ink);p.x.globalCompositeOperation='screen';p.x.fillStyle=styleOf(c);p.x.fill(path);p.x.globalCompositeOperation='source-over';}
  line(ink,pts,w,key,opts={}){const p=this.P(ink);const path=strokePath(pts,w,this.r(key),opts);p.x.fillStyle=grey(opts.cov==null?1:opts.cov);p.x.fill(path);
    if(ink==='indigo'){const s=this.strokes.x;s.fillStyle='#fff';s.fill(path);s.strokeStyle='#fff';s.lineWidth=6;s.stroke(path);}return path;}
  ring(ink,cx,cy,r,w,key,opts={}){const p=this.P(ink);const path=ringPath(cx,cy,r,w,this.r(key),opts.wob==null?0.03:opts.wob);p.x.fillStyle=grey(opts.cov==null?1:opts.cov);
    if(opts.add){p.x.globalCompositeOperation='screen';}p.x.fill(path);p.x.globalCompositeOperation='source-over';
    if(ink==='indigo'){const s=this.strokes.x;s.fillStyle='#fff';s.fill(path);s.strokeStyle='#fff';s.lineWidth=6;s.stroke(path);}return path;}
  // ink-starved voids: n soft holes 3-8 px inside the path
  voids(ink,path,n,key,lo=3,hi=8){(this.voidCount||(this.voidCount={}))[ink]=((this.voidCount||{})[ink]||0)+n;if(!TEXTURE)return;const p=this.P(ink);const r=this.r(key);const x=p.x;x.save();x.clip(path);x.globalCompositeOperation='multiply';
    const b=this.bounds(path,r);
    for(let i=0;i<n;i++){const cx=r.range(b[0],b[2]),cy=r.range(b[1],b[3]),rad=r.range(lo,hi)/2;const g=x.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,grey(0.3));g.addColorStop(0.6,grey(0.7));g.addColorStop(1,'#fff');x.fillStyle=g;x.fillRect(cx-rad,cy-rad,rad*2,rad*2);}
    x.restore();}
  // faint density ramp ±4 % across the field

    const X=px-M+0.5-AX,Y=py-M+0.5-AY;let v=0;
    if(X>0){const rho=Math.hypot(X,Y);const w=X*tanH;const across=Math.abs(Y);
      if(across<w&&rho>=inner-3){let s=1;if(soft>0)s=clamp((w-across)/Math.min(soft,w*0.6),0,1);else s=1;
        const ins=clamp((rho-(inner-3))/3,0,1);const along=clamp((rho-inner)/(rmax-inner),0,1);
        v=(flat!=null?flat:lerp(1,0.35,along))*s*ins;}}
    const i=(py*PW+px)*4,g=Math.round(v*255);d[i]=d[i+1]=d[i+2]=g;d[i+3]=255;const gi=255-g;e[i]=e[i+1]=e[i+2]=gi;e[i+3]=255;

/* ----- the keeper: a coat, a cap brim, a chin line and legs --------- */
// feet at (x,y), height h, dir +1 faces right, key 0/1 leg pose; returns Path2D (fill)
function keeperPath(x,y,h,dir,key,r,opts={}){
  const p=new Path2D();const bob=key?-2:0;const j=TEXTURE?0.6:0;const J=()=>r.range(-j,j);
  const d=dir;
  // coat (shoulders rounded, hem flared)
  const c=[[x-h*0.15+J(),y-h*0.72+bob],[x-h*0.06+J(),y-h*0.80+bob],[x+h*0.08+J(),y-h*0.80+bob],[x+h*0.16+J(),y-h*0.72+bob],[x+h*0.20+J(),y-h*0.30+bob],[x-h*0.20+J(),y-h*0.30+bob]];
  p.moveTo(c[0][0],c[0][1]);p.quadraticCurveTo(c[1][0],c[1][1],(c[1][0]+c[2][0])/2,c[1][1]);p.quadraticCurveTo(c[2][0],c[2][1],c[3][0],c[3][1]);p.lineTo(c[4][0],c[4][1]);p.lineTo(c[5][0],c[5][1]);p.closePath();
  // head, forward of the collar so the chin reads
  const hx=x+d*h*0.05,hy=y-h*0.91+bob,hr=h*0.095;p.moveTo(hx+hr,hy);p.arc(hx,hy,hr,0,TAU);
  p.rect(x-h*0.03,y-h*0.86+bob,h*0.07,h*0.08);
  // cap brim
  p.moveTo(hx+d*hr*0.2,hy-hr*0.75);p.lineTo(hx+d*hr*2.2,hy-hr*0.55);p.lineTo(hx+d*hr*2.2,hy-hr*0.25);p.lineTo(hx+d*hr*0.2,hy-hr*0.35);p.closePath();
  // legs
  const lw=h*0.075,hem=y-h*0.30+bob;
  const legs=key?[[x+d*h*0.03,x+d*h*0.05],[x-d*h*0.04,x-d*h*0.02]]:[[x+d*h*0.05,x+d*h*0.15],[x-d*h*0.05,x-d*h*0.13]];
  for(const [top,foot] of legs){p.moveTo(top-lw/2,hem);p.lineTo(top+lw/2,hem);p.lineTo(foot+lw/2,y);p.lineTo(foot-lw/2,y);p.closePath();}
  // arm with a lantern held ahead at hip height
  if(opts.lantern){const ax=x+d*h*0.10,ay=y-h*0.66+bob,bx=x+d*h*0.34,by=y-h*0.44+bob;const aw=h*0.06;
    const nx=-(by-ay),ny=bx-ax;const nl=Math.hypot(nx,ny);const ux=nx/nl*aw/2,uy=ny/nl*aw/2;
    p.moveTo(ax+ux,ay+uy);p.lineTo(bx+ux,by+uy);p.lineTo(bx-ux,by-uy);p.lineTo(ax-ux,ay-uy);p.closePath();
    opts.hand=[bx,by];}
  return p;
}

function profilePath(pose,r){ // the keeper in profile: head, cap brim, shoulders, one arm to the wick
  const p=new Path2D();const j=TEXTURE?1:0;const J=()=>r.range(-j,j);
  // body: from the left edge to the shoulder, down off the bottom
  const body=[[36,724],[36,380],[60,352],[120,344],[170,340],[205,352],[236,366],[250,400],[252,724]];
  const s=catmull(body.map(q=>[q[0]+J(),q[1]+J()]),false);p.moveTo(s[0][0],s[0][1]);s.forEach(q=>p.lineTo(q[0],q[1]));p.closePath();
  // head with a chin and a cap brim
  const hx=150,hy=300,hr=40;p.moveTo(hx+hr,hy);p.arc(hx,hy,hr,0,TAU);
  p.moveTo(hx+10,hy-30);p.lineTo(hx+66,hy-22);p.lineTo(hx+66,hy-12);p.lineTo(hx+10,hy-16);p.closePath();
  p.moveTo(hx+20,hy+10);p.lineTo(hx+34,hy+26);p.lineTo(hx+16,hy+38);p.closePath();
  // neck
  p.rect(hx+2,hy+30,26,26);
  // arm: shoulder (212,362) to the hand
  const hand=pose?[312,362]:[292,428];const ax=212,ay=362,aw=22;
  const nx=-(hand[1]-ay),ny=hand[0]-ax;const nl=Math.hypot(nx,ny);const ux=nx/nl*aw/2,uy=ny/nl*aw/2;
  p.moveTo(ax+ux,ay+uy);p.lineTo(hand[0]+ux,hand[1]+uy);p.lineTo(hand[0]-ux,hand[1]-uy);p.lineTo(ax-ux,ay-uy);p.closePath();
  p.moveTo(hand[0]+12,hand[1]);p.arc(hand[0],hand[1],12,0,TAU);
  p.hand=[hand[0]+10,hand[1]-2];
  return p;
}

/* ====================================================================
   HALFTONE DISSOLVE — every dot (or grain fleck) shrinks on its own
   clock: coverage × (1 − easeInQuad(local p))², start per cell, seeded.
   ==================================================================== */
function makeDissolve(cellOf,box,key,startFn,dur,floorFn){
  const [x0,y0,x1,y1]=box;const w=x1-x0,h=y1-y0;const starts=new Float32Array(w*h);const floors=new Float32Array(w*h);
  const cache=new Map();const r=rng(key);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const px=x0+x+M,py=y0+y+M;const id=cellOf(px,py);let j=cache.get(id);if(j==null){j=r();cache.set(id,j);}
    starts[y*w+x]=startFn(x0+x,y0+y,j);floors[y*w+x]=floorFn?floorFn(x0+x,y0+y):0;}
  const img=new ImageData(w,h);return{box,w,h,starts,floors,dur,img};
}
// multiplies the coverage in ctx by the dissolve field at age (s); returns the mean multiplier
function applyDissolve(ctx,dis,age){
  const {w,h,starts,floors,dur,img,box}=dis;const d=img.data;let sum=0;
  for(let i=0;i<w*h;i++){const p=clamp((age-starts[i])/dur,0,1);const e=1-p*p;let m=e*e;const f=floors[i];if(m<f)m=f;sum+=m;const g=Math.round(m*255);const k=i*4;d[k]=d[k+1]=d[k+2]=g;d[k+3]=255;}
  const t=DISS_TMP;t.width=w;t.height=h;t.getContext('2d').putImageData(img,0,0);
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(t,box[0],box[1]);ctx.restore();return sum/(w*h);
}
const DISS_TMP=document.createElement('canvas');

/* ---------------------------- 12. page ------------------------------ */
const stage=document.getElementById('stage');
const DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
stage.width=Math.round(W*DPR);stage.height=Math.round(H*DPR);stage.style.width=W+'px';stage.style.height=H+'px';
const sx=stage.getContext('2d');
function blit(){sx.setTransform(1,0,0,1,0,0);sx.imageSmoothingEnabled=false;sx.drawImage(ACC.c,0,0,stage.width,stage.height);}
function present(t){render(t);blit();}
window.frameCanvas=ACC.c;
window.renderAt=t=>{present(t);return ACC.c;};

let T=0,playing=false,lastTs=0;
const rangeEl=document.getElementById('range'),timeEl=document.getElementById('time'),playEl=document.getElementById('play');
function show(t){T=clamp(t,0,DUR-1/FPS/2);present(T);rangeEl.value=T;timeEl.textContent=T.toFixed(3);}
function tick(ts){if(!playing)return;const dt=(ts-lastTs)/1000;lastTs=ts;let t=T+dt;if(t>=DUR){t=0;}show(t);requestAnimationFrame(tick);}
function setPlaying(p){playing=p;playEl.textContent=p?'pause':'play';if(p){lastTs=performance.now();requestAnimationFrame(tick);}}
playEl.onclick=()=>setPlaying(!playing);
rangeEl.oninput=()=>{setPlaying(false);show(parseFloat(rangeEl.value));};
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}
  else if(e.code==='ArrowRight'){setPlaying(false);show(T+1/FPS);}
  else if(e.code==='ArrowLeft'){setPlaying(false);show(T-1/FPS);}
  else if(e.key==='r'||e.key==='R'){record();}
  else if(e.key==='m'||e.key==='M'){toggleClick();}
});
{const marks=document.getElementById('marks');for(const a of ACTS){const i=document.createElement('i');i.style.left=(a/DUR*100)+'%';marks.appendChild(i);}}
// R: record a WebM at 24 fps via captureStream + MediaRecorder
function record(){if(!window.MediaRecorder)return;const stream=stage.captureStream(FPS);const rec=new MediaRecorder(stream,{mimeType:'video/webm'});const chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='keeper.webm';a.click();};
  rec.start();let f=0;const step=()=>{if(f>=DUR*FPS){rec.stop();return;}show(f/FPS);f++;setTimeout(step,1000/FPS);};setPlaying(false);step();}
// M: a click at 120 BPM (muted by default)
let clickOn=false,audio=null,clickTimer=null;
function toggleClick(){clickOn=!clickOn;if(clickOn){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const tickC=()=>{if(!clickOn)return;if(playing){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=1200;g.gain.value=0.05;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+0.02);}clickTimer=setTimeout(tickC,500);};tickC();}else clearTimeout(clickTimer);}

function cropView(){const [cx,cy]=Q.get('crop').split(',').map(Number);const crop=mk(100,100);crop.x.drawImage(ACC.c,cx-50,cy-50,100,100,0,0,100,100);sx.setTransform(1,0,0,1,0,0);sx.imageSmoothingEnabled=false;sx.fillStyle='#000';sx.fillRect(0,0,stage.width,stage.height);sx.drawImage(crop.c,0,0,100,100,0,0,400*DPR,400*DPR);}
/* ---------------------------- 13. boot ------------------------------ */
function bootSync(){buildScreens();buildMasks();PAPERC=buildPaper();}
const tParam=Q.get('t');
if(tParam!=null){
  document.body.classList.add('still');
  bootSync();
  const t=parseFloat(tParam);
  if(Q.get('scene')==='test'){const b=getScene('test');const a=ACC.x;a.drawImage(PAPERC,0,0);compositeScene(a,b,t);if(Q.get('crop')){cropView();}else blit();}
  else{
    if(Q.get('crop')){render(t);cropView();}
    else show(t);
  }

}else{

  const bar=document.querySelector('#load b');

  const step=()=>{if(i<ids.length){getScene(ids[i]);i++;bar.style.width=(i/ids.length*100)+'%';setTimeout(step,0);}else{document.getElementById('load').style.display='none';show(0);window.__ready=true;if(Q.get('verify')==='1')runVerify();if(Q.get('autoplay')==='1')setPlaying(true);}};
  step();
}

/* ---------------------------- 11. verification --------------------- */
const V={rows:[],log(name,pass,evidence){V.rows.push({name,pass,evidence});}};
function plateData(ink){const {b,D}=LAST;if(D.used[ink])return WORK[ink].x.getImageData(0,0,PW,PH).data;const p=b.S.plates[ink];if(!p)return null;return p.x.getImageData(0,0,PW,PH).data;}
function cov(d,x,y){if(!d||x<0||y<0||x>=W||y>=H)return 0;return d[((y+M)*PW+(x+M))*4]/255;}
function annulusCentroid(d,r0,r1){let sx=0,sy=0,sw=0;for(let y=AY-r1-1;y<=AY+r1+1;y++)for(let x=AX-r1-1;x<=AX+r1+1;x++){const rr=Math.hypot(x+0.5-AX,y+0.5-AY);if(rr<r0||rr>r1)continue;const w=cov(d,x,y);sx+=w*(x+0.5);sy+=w*(y+0.5);sw+=w;}return sw>0?[sx/sw,sy/sw,sw]:null;}
function frameHash(){const d=ACC.x.getImageData(0,0,W,H).data;let x=0x811c9dc5;for(let i=0;i<d.length;i+=4){x^=d[i];x=Math.imul(x,16777619);x^=d[i+1];x=Math.imul(x,16777619);x^=d[i+2];x=Math.imul(x,16777619);}return(x>>>0).toString(16).padStart(8,'0');}
function check1(){const times=[0,4,7,13,15,17,DUR-1/FPS];const out=[];let pass=true;
  for(const t of times){render(t);const {b}=LAST;const mr=b.def.misregAt?b.def.misregAt(t):b.misreg;
    const y=plateData('yellow');const cy=y?annulusCentroid(y,0,21):null;const lit=!!(cy&&cy[2]>400);
    const c=lit?cy:annulusCentroid(plateData('indigo'),14,21);const ink=lit?'yellow':'indigo';
    const d=c?Math.hypot(c[0]-AX,c[1]-AY):Infinity;const v=mr[ink]||[0,0];const on=c?[c[0]+v[0],c[1]+v[1]]:[NaN,NaN];const don=Math.hypot(on[0]-AX,on[1]-AY);
    const ok=d<=1.0&&don<=3;pass=pass&&ok;out.push(`t=${t.toFixed(3)} ${b.id} ${ink} centroid=(${c?c[0].toFixed(2):'-'}, ${c?c[1].toFixed(2):'-'}) d=${d.toFixed(2)} px; on-screen (${on[0].toFixed(1)}, ${on[1].toFixed(1)}) d=${don.toFixed(2)} ${ok?'ok':'FAIL'}`);}
  V.log('1 anchor at every act boundary',pass,out.join('\n'));}
function check2(){const ids=['s5','s6','s8','s9','s10','s11','s12','s13','s14','s15','s16','s17','s18','s19'];const out=[];let pass=true;
  for(const id of ids){const c=cueOf(id);const t=c.start+c.dur-1/FPS;render(t);const y=plateData('yellow');const v=cov(y,360,360);
    const target=c.dur>=0.5?90:60;let rad=null;const geo=LAST.ringR;
    if(!['s12','s15','s17','s18'].includes(id)){const rs=[];for(let k=0;k<16;k++){const a=k/16*TAU;for(let r=26;r<160;r+=0.5){const x=Math.floor(AX+Math.cos(a)*r),yy=Math.floor(AY+Math.sin(a)*r);const cv=cov(y,x,yy);if(cv>=0.28&&cv<=0.52){rs.push(r);break;}}}rs.sort((a,b)=>a-b);rad=rs.length?rs[rs.length>>1]:NaN;}
    const ok=v>=0.95&&(id==='s18'||Math.abs(geo-target)<=3)&&(rad==null||Math.abs(rad-target)<=3);pass=pass&&ok;
    out.push(`${id} t=${t.toFixed(3)} yellow@anchor=${(v*100).toFixed(0)}% ring r: drawn=${id==='s18'?'n/a (burst form)':geo.toFixed(1)} pixel-scan=${rad==null?'n/a':rad.toFixed(1)} target=${target} ${ok?'ok':'FAIL'}`);}
  V.log('2 every montage sheet lands the answer',pass,out.join('\n'));}
function check3(){const out=[];let pass=true;const dm=mk();
  for(const c of CUES){const t=c.start+c.dur/2;render(t);const {b}=LAST;const S=b.S;
    const bl=plateData('blue'),pk=plateData('pink'),ind=plateData('indigo');
    dm.x.clearRect(0,0,PW,PH);for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)dm.x.drawImage(S.strokes.c,dx,dy);const md=dm.x.getImageData(0,0,PW,PH).data;
    let n1=0,n2=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=((y+M)*PW+(x+M))*4;const B=bl?bl[i]:0,P=pk?pk[i]:0,I=ind?ind[i]:0;if(B>=217&&P>=217)n1++;if(I>=217&&B>=217&&md[i+3]<128)n2++;}
    const ok=n1===0&&n2===0;pass=pass&&ok;out.push(`${c.scene} t=${t.toFixed(3)} blue∧pink≥85%: ${n1}   indigo∧blue≥85% outside strokes: ${n2} ${ok?'ok':'FAIL'}`);}
  V.log('3 no dark-on-dark',pass,out.join('\n'));}
function check4(){const out=[];let pass=true;const onGrid=v=>Math.abs(v/0.25-Math.round(v/0.25))<1e-9;
  for(const c of CUES){if(!(onGrid(c.start)&&onGrid(c.start+c.dur))){pass=false;out.push(`${c.scene} off the 0.25 s grid`);}}
  out.push(`${CUES.length} cues, all starts and ends on the 0.25 s grid`);
  const lit=['s3','s4','s5','s6','b1','b2','b3','s8','s9','s10','s11','s12','s13','s14','s15','s16','s17','s18','s19','s20','s22'];
  for(const c of CUES){const b=getScene(c.scene);const hs=new Set();for(let f=Math.ceil(c.start*FPS-1e-6);f<Math.round((c.start+c.dur)*FPS);f++){const t=f/FPS;hs.add(JSON.stringify(b.def.misregAt?b.def.misregAt(t):b.misreg));}
    const mr=b.misreg;const one=hs.size===1;const fr=lit.includes(c.scene)?(mr.pink[0]-mr.yellow[0]>=1):true;const zero=c.scene==='s21'?INKS.every(k=>mr[k][0]===0&&mr[k][1]===0):true;
    const ok=one&&fr&&zero;pass=pass&&ok;
    out.push(`${c.scene}: ${hs.size} vector set over ${hs.size?'its frames':''} ${JSON.stringify(mr)}${lit.includes(c.scene)?` fringe dx=${mr.pink[0]-mr.yellow[0]}`:''}${c.scene==='s21'?(zero?' all (0,0)':' NOT ZERO'):''} ${ok?'ok':'FAIL'}`);}
  V.log('4 grid and vectors',pass,out.join('\n'));}
function unscreenedRuns(){const d=ACC.x.getImageData(0,0,W,H).data;const B=8,nx=W/B,ny=H/B;const mean=new Float32Array(nx*ny),flat=new Uint8Array(nx*ny);
  for(let by=0;by<ny;by++)for(let bx=0;bx<nx;bx++){let s1=0,s2=0;for(let y=0;y<B;y++)for(let x=0;x<B;x++){const i=((by*B+y)*W+bx*B+x)*4;const L=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;s1+=L;s2+=L*L;}const m=s1/64,v=s2/64-m*m;mean[by*nx+bx]=m;flat[by*nx+bx]=Math.sqrt(Math.max(0,v))<4?1:0;}
  let runs=0;for(let by=0;by<ny;by++)for(let bx=0;bx<nx-3;bx++){const k=by*nx+bx;if(!(flat[k]&&flat[k+1]&&flat[k+2]&&flat[k+3]))continue;const d1=mean[k+1]-mean[k],d2=mean[k+2]-mean[k+1],d3=mean[k+3]-mean[k+2];const mono=(d1>1.5&&d2>1.5&&d3>1.5)||(d1<-1.5&&d2<-1.5&&d3<-1.5);if(mono)runs++;}return runs;}
function check5(){const out=[];let pass=true;for(const t of[6.0,9.25,4.9,14.25]){render(t);const n=unscreenedRuns();pass=pass&&n===0;out.push(`t=${t}: flat 8 px blocks with a monotonic tone drift across ≥ 32 px (unscreened gradient signature): ${n}${TEXTURE?'':' (texture=0 negative control: ramps are expected here)'}`);}
  out.push(`screen angles by construction: yellow ${ANGLE.yellow}°, blue ${ANGLE.blue}°, pink ${ANGLE.pink}°, indigo ${ANGLE.indigo}°, pitch ${PITCH} px (9 px campfire halo); distinct: ${new Set(Object.values(ANGLE)).size===4}`);
  out.push('4× crops: out/stills/crop_6_0_anchor.png, crop_6_0_200.png, crop_9_25_anchor.png, crop_9_25_200.png');
  V.log('5 screening',pass&&new Set(Object.values(ANGLE)).size===4,out.join('\n'));}
function check6(){const out=[];let pass=true;const mask=mk();
  for(const c of CUES){const b=getScene(c.scene);const S=b.S;if(!S.bases)continue;
    S.bases.forEach((reg,k)=>{if(reg.cut)return;const p=S.plates[reg.ink];if(!p)return;const d=p.x.getImageData(0,0,PW,PH).data;
      mask.x.setTransform(1,0,0,1,0,0);mask.x.clearRect(0,0,PW,PH);mask.x.translate(M,M);mask.x.fillStyle='#fff';mask.x.fill(reg.path);
      mask.x.globalCompositeOperation='destination-out';for(let j=k+1;j<S.bases.length;j++)mask.x.fill(S.bases[j].path);mask.x.globalCompositeOperation='source-over';
      const md=mask.x.getImageData(0,0,PW,PH).data;let n=0,sum=0,lo=0,hi=0;
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=((y+M)*PW+(x+M))*4;if(md[i+3]<128)continue;const v=d[i]/255;if(v<0.05)continue;n++;sum+=v;if(v>0.01&&v<0.14)lo++;if(v>0.86&&v<0.99)hi++;}
      const mean=n?sum/n:0;const voids=(S.voidCount||{})[reg.ink]||0;const ok=mean>=0.70&&mean<=0.86;pass=pass&&ok;
      out.push(`${c.scene} ${reg.name} (${reg.ink}): mean ${(mean*100).toFixed(1)}% over ${n} px; voids on plate ${voids}; tint 1–14%: ${lo} px, 86–99%: ${hi} px ${ok?'ok':'FAIL'}`);});}
  V.log('6 coverage caps',pass,out.join('\n'));}
function check9(){for(let f=Math.round(7*FPS);f<13*FPS;f++)render(f/FPS);ACC.x.getImageData(0,0,1,1);   // warm every cache and the GPU
  const ts=[];for(let f=Math.round(7*FPS);f<13*FPS;f++){const t0=performance.now();render(f/FPS);ACC.x.getImageData(0,0,1,1);ts.push(performance.now()-t0);}const mean=ts.reduce((a,b)=>a+b)/ts.length,max=Math.max(...ts);
  const gl=document.createElement('canvas').getContext('webgl');const dbg=gl&&gl.getExtension('WEBGL_debug_renderer_info');const renderer=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'software';
  V.log('9 frame cost 7.0–13.0 s',mean<=18&&max<=50,`render(t) + GPU completion, caches warm: mean ${mean.toFixed(2)} ms, max ${max.toFixed(2)} ms over ${ts.length} frames; canvas backend: ${renderer}`);}
function check10(){const src=document.scripts[0].textContent;const calls=(src.match(/(fill|stroke)Text\(/g)||[]).length;const strokes=GLYPHS.reduce((a,g)=>a+g.strokes.length,0);
  V.log('10 text',GLYPHS.length===6&&calls===0,`${GLYPHS.length} glyph paths (${strokes} strokes), one pink copy; canvas text calls in source: ${calls}; still out/stills/t19_0.png`);}
function covB(d,x,y){const x0=Math.floor(x-0.5),y0=Math.floor(y-0.5);const fx=x-0.5-x0,fy=y-0.5-y0;return cov(d,x0,y0)*(1-fx)*(1-fy)+cov(d,x0+1,y0)*fx*(1-fy)+cov(d,x0,y0+1)*(1-fx)*fy+cov(d,x0+1,y0+1)*fx*fy;}
function ringVariance(ink){const d=plateData(ink);const rs=[];for(let k=0;k<36;k++){const a=k/36*TAU;let sw=0,sr=0;for(let r=13;r<=21;r+=0.125){const x=AX+Math.cos(a)*r,y=AY+Math.sin(a)*r;const c=covB(d,x,y);sw+=c;sr+=c*r;}rs.push(sw>0?sr/sw:NaN);}const m=rs.reduce((a,b)=>a+b)/36;return rs.reduce((a,b)=>a+(b-m)*(b-m),0)/36;}
function check11(){const out=[];let pass=true;let vmax=0,ymax=0;
  for(let f=Math.round(15*FPS);f<17*FPS;f++){const t=f/FPS;render(t);const v=ringVariance('indigo');vmax=Math.max(vmax,v);const y=plateData('yellow');for(let yy=AY-16;yy<=AY+16;yy++)for(let x=AX-16;x<=AX+16;x++)if(Math.hypot(x+0.5-AX,yy+0.5-AY)<16)ymax=Math.max(ymax,cov(y,x,yy));}
  const okM=vmax<=0.005&&ymax===0;pass=pass&&okM;out.push(`15.0 ≤ t < 17.0: ring radius variance over 36 angles max ${vmax.toExponential(2)} px² (geometry: wobble amplitude 0, variance exactly 0); yellow inside the ring max ${ymax}; beam edges: straight by construction (hard-edged 8° mask, no soft ramp) ${okM?'ok':'FAIL'}`);
  const wob=[];for(const t of[0.2,4.0,13.2,17.2,7.0]){render(t);const y=plateData('yellow');const lit=y&&cov(y,360,360)>0.5;const v=lit?NaN:ringVariance('indigo');if(!lit){wob.push(`t=${t}: ${v.toExponential(2)}`);if(!(v>0.005))pass=false;}}
  out.push(`unlit ring variance elsewhere (must be > 0): ${wob.join(', ')}`);
  V.log('11 the machine',pass,out.join('\n'));}
function check12(){const out=[];let pass=true;const mask=mk();
  for(const id of['s4','s20','s21']){const c=cueOf(id);const b=getScene(id);mask.x.setTransform(1,0,0,1,0,0);mask.x.clearRect(0,0,PW,PH);mask.x.translate(M,M);mask.x.fillStyle='#fff';mask.x.save();mask.x.beginPath();mask.x.rect(0,392,720,400);mask.x.clip();mask.x.fill(b.S.masks.tower);mask.x.restore();const md=mask.x.getImageData(0,0,PW,PH).data;
    let worst=0,frames=0;for(let f=Math.ceil(c.start*FPS-1e-6);f<Math.round((c.start+c.dur)*FPS);f++){render(f/FPS);frames++;const y=plateData('yellow');let sum=0;for(let yy=392;yy<610;yy++)for(let x=320;x<400;x++){const i=((yy+M)*PW+(x+M))*4;if(md[i+3]>128)sum+=y?y[i]:0;}worst=Math.max(worst,sum);}
    const ok=worst===0;pass=pass&&ok;out.push(`${id}: ${frames} frames, max yellow coverage sum inside the tower below y=392: ${worst} ${ok?'ok':'FAIL'}`);}
  V.log('12 the beam never crosses the tower',pass,out.join('\n'));}
function paletteCheck(){const inks=Object.values(HEX).map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);const paper=[0xF2,0xED,0xE3];
  const combos=[];for(let m=0;m<16;m++){const v=paper.slice();for(let k=0;k<4;k++)if(m&(1<<k))for(let ch=0;ch<3;ch++)v[ch]=v[ch]*inks[k][ch]/255;combos.push(v);}
  const out=[];let pass=true;
  for(const t of[1.0,3.0,6.0,9.25,11.4,14.25,16.0,19.0]){render(t);const d=ACC.x.getImageData(0,0,W,H).data;let bad=0;
    for(let i=0;i<d.length;i+=4){let okp=false;for(const p of combos){let vmin=9,vmax=0,fail=false;for(let ch=0;ch<3;ch++){if(p[ch]<=8){if(d[i+ch]>12){fail=true;break;}}else{const v=d[i+ch]/p[ch];if(v<vmin)vmin=v;if(v>vmax)vmax=v;}}
      if(!fail&&(vmax===0||(vmin>=0.86&&vmax<=1.09&&vmax-vmin<=0.07))){okp=true;break;}}if(!okp)bad++;}
    pass=pass&&bad===0;out.push(`t=${t}: pixels not explained by paper × an ink subset: ${bad}`);}
  V.log('B colours are inks × paper only',pass,out.join('\n'));}
function runVerify(){
  const t0=performance.now();
  const hCold=(render(9.2),frameHash());
  check1();check2();check3();check4();check5();check6();check9();check10();check11();check12();paletteCheck();
  render(3.0);const hAfter3=(render(9.2),frameHash());for(let f=0;f<DUR*FPS;f++)render(f/FPS);const hFull=(render(9.2),frameHash());
  const src=document.scripts[0].textContent;const rnd=(src.match(/Math\.random\(/g)||[]).length;
  V.log('7 determinism',hCold===hAfter3&&hAfter3===hFull&&rnd===0,`frame hash at t=9.2: cold ${hCold}, after t=3.0 ${hAfter3}, after a full play-through ${hFull}; ${'Math.'+'random('} in source: ${rnd}`);
  V.rows.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const txt=V.rows.map(r=>`${r.pass?'PASS':'FAIL'}  ${r.name}\n${r.evidence.split('\n').map(l=>'      '+l).join('\n')}`).join('\n')+`\n(verification took ${((performance.now()-t0)/1000).toFixed(1)} s)`;
  document.getElementById('verify').textContent=txt;console.log(txt);window.__verify=V.rows;window.__verifyText=txt;show(0);
}
